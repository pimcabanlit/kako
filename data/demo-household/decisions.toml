# What the household decided in its sessions before the demo begins (docs/data-model.md, "Worked
# example"). Each decision is written after the change it follows, at the same moment, through the
# proposal store: a `decision` proposal with the household's words as evidence, approved by the
# person named. Its assumptions are the facts of that day as known then (kako/decisions/assumptions.py),
# so a later new job sends it back to the household as "to revisit".

