# Dreaming's labelled set (Phase 4, task 3): scripted sessions with what a person would expect
# dreaming to propose after each one.
#
# Each case is a session on the demo household (data/demo-household/, loaded through Dec 1, 2026),
# as of `on` and as known at `known_at`, so Kako holds the facts the household had then. Its turns
# are the household's words, each with its speaker (a key in people.csv) and a seed unique across
# the set. `kako dream eval` runs extraction (the one model step) and dreaming's checks over each
# case and scores what it would propose (backend/src/kako/evals/dreaming.py):
#
#   expect  the proposals a person would expect: each must be found
#   maybe   proposals that are fine either way: neither found nor wrong (a raise as a life event)
#
# Anything else dreaming would propose is wrong. Each proposal is written as
#   { kind = "new_fact" | "replace_fact", entity = <ref or "">, attribute, value, valid_from }
#   { kind = "retract_fact", entity, attribute }         the fact in force that is retracted
#   { kind = "life_event", event = <kind>, on = <day> }
# with values as the household gave them (pesos "68000", a rate "0.095", a whole number, a date).
#
# The set passes when at least 90% of the expected proposals are found and no proposal has a number
# that isn't in its quote (V-09). tests/test_evals_dreaming.py holds every case to the demo
# household, so the set can't drift from it.

version = 1

# --- Nov 20, 2026: after the November statements, before Mara's news. --------------------------

[[case]]
id = "d01"
on = 2026-11-20
known_at = 2026-11-20T19:00:00+08:00
why = "Session 4's news: a life event and the salary it changes, from Dec 1."
turns = [
  { speaker = "mara", seed = "d01:t1", message = "Mara here, with news: I got a new job! I start on Dec 1, and my take-home pay will be ₱68,000 a month." },
]
expect = [
  { kind = "life_event", event = "new_job", on = 2026-12-01 },
  { kind = "replace_fact", entity = "income:mara-s-salary", attribute = "income.monthly_net", value = "68000", valid_from = 2026-12-01 },
]

[[case]]
id = "d02"
on = 2026-11-20
known_at = 2026-11-20T19:00:00+08:00
why = "A raise from a later date: a replacement from that day."
turns = [
  { speaker = "jun", seed = "d02:t1", message = "Jun here. Good news from work: my take-home pay goes up to ₱51,000 a month from January 1, 2027." },
]
expect = [
  { kind = "replace_fact", entity = "income:jun-s-salary", attribute = "income.monthly_net", value = "51000", valid_from = 2027-01-01 },
]
maybe = [
  { kind = "life_event", event = "raise", on = 2027-01-01 },
]

[[case]]
id = "d03"
on = 2026-11-20
known_at = 2026-11-20T19:00:00+08:00
why = "A correction: the value Kako holds was wrong from the start, so it is retracted and the right one takes its place from the same day."
turns = [
  { speaker = "mara", seed = "d03:t1", message = "Sorry, I had it wrong when we started: rent and utilities are ₱38,000 a month, not ₱40,000." },
]
expect = [
  { kind = "retract_fact", entity = "expense:rent-and-utilities", attribute = "expense.monthly_amount" },
  { kind = "new_fact", entity = "expense:rent-and-utilities", attribute = "expense.monthly_amount", value = "38000", valid_from = 2026-03-01 },
]

[[case]]
id = "d04"
