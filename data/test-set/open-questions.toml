# Kako's open-question test set: everyday questions nobody planned for, one turn each.
#
# The same format and checks as conversations.toml (backend/src/kako/evals/conversations.py), on the
# demo household loaded through Dec 1, 2026. Each question must be answered (no flat "can't"), change
# nothing unless it is news (`proposes`), pass the number check, and here also:
#   kinds    the kinds of answer that fit (inform, explain, look_up, compute, simulate, advise, plan,
#            record, small_talk)
#   sourced  true: the answer names at least one source
#   labels   labels the answer must carry: "General information", "Scenario, nothing saved",
#            "Calculated", "From your documents"
# `kako conversations --set open` replays data/recorded/open-questions-<architecture>.json.

version = 1

[[conversation]]
id = "o01"
title = "Salary up by 20k"
on = 2026-12-01
known_at = 2026-12-01T12:00:00+08:00

[[conversation.turn]]
by = "jun"
message = "what happens if my salary increases by 20000"
kinds = ["simulate"]
proposes = false
sourced = true
labels = ["Scenario, nothing saved"]
any = ["surplus", "left over", "what-if"]
lacks = ["Kako can't test", "can't test that", "cannot answer"]

