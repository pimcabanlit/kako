[question.expect]
not_recommended = { "debt:credit-card" = "₱9,050.00", "account:emergency-fund" = "₱0.00" }
states = ["16 months"]
sources = ["fact:preference.debt_vs_flexibility"]

[[question]]
id = "q11"
on = 2026-10-20
known_at = 2026-10-20T22:00:00+08:00
message = "How is the emergency fund doing?"
