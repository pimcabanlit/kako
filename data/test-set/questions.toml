[question.expect]
states = ["2.2 months", "11 months"]

[[question]]
id = "q12"
on = 2026-10-20
known_at = 2026-10-20T22:00:00+08:00
message = "What if we moved the ₱5,050 from the emergency fund to the card instead?"
why = "Runs the move (8 months for the card) and names the preference it goes against."
[question.expect]
options = { min = 1, max = 4 }
allocations = [{ "debt:credit-card" = "₱9,050.00", "account:emergency-fund" = "₱0.00" }]
states = ["8 months"]
cites = ["debt.payoff_months@debt:credit-card"]
sources = ["fact:preference.debt_vs_flexibility"]

